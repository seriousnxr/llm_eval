server:
  base_url: "http://localhost:8000"
  model: "gpt-4"
  temperature: 0.0
  max_tokens: 2048
  top_p: 1.0
  stop: null
  timeout_seconds: 30

retry:
  max_retries: 5
  base_delay: 1.0
  max_delay: 60.0
  retry_status_codes: [429, 503]

concurrency:
  max_workers: 10
  batch_size: 50

output:
  results_dir: "results"

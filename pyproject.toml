[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Lightweight LLM evaluation harness for GPQA, MATH500, and LiveCodeBench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "datasets>=2.14",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "numpy>=1.24",
    "huggingface_hub>=0.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
]

[project.scripts]
eval-harness = "eval_harness.runner:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
